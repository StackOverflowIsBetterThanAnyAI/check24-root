services:
    postgres:
        image: postgres:15-alpine
        environment:
            POSTGRES_DB: users_db
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: secret
        volumes:
            - pgdata:/var/lib/postgresql/data

    backend:
        build: ./backend
        environment:
            - DB_HOST=postgres
            - DB_PORT=5432
            - DB_NAME=users_db
            - DB_USER=postgres
            - DB_PASSWORD=secret
        depends_on:
            - postgres

    frontend:
        build: ./frontend
        depends_on:
            - backend

    nginx:
        image: nginx:alpine
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - frontend
            - backend

volumes:
    pgdata:
